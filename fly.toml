# fly.toml app configuration file generated for leadpilotai on 2026-10-26T14:29:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'leadpilotai'
primary_region = 'ams'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  PORT = '8000'
  PYTHON_VERSION = '3.12.0'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
