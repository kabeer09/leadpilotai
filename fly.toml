app = "leadpilotai"
primary_region = "ams"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8000"
  PYTHON_VERSION = "3.12.0"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
